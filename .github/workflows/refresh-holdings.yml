name: Refresh official ETF portfolios
on:
  schedule:
    - cron: '30 17 * * 0' # Sunday 20:30 Asia/Qatar (UTC+3)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-holdings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download and validate complete issuer portfolios
        id: refresh
        continue-on-error: true
        env:
          # The SEC blocks anonymous clients. Set the repository variable SEC_USER_AGENT to "ETF-Overlap you@example.com".
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || format('ETF-Overlap {0}@users.noreply.github.com', github.repository_owner) }}
        run: npx tsx script/refresh-holdings.ts
      - name: Preserve successful portfolios and source errors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holdings.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated official ETF portfolios'
            # main may have moved while the job ran; replay this data commit on top, preferring the fresh download.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 5))
            done
          fi
      - name: Check portfolio freshness
        id: freshness
        continue-on-error: true
        run: npx tsx script/check-freshness.ts
      - name: Report source failures
        if: steps.refresh.outcome == 'failure' || steps.freshness.outcome == 'failure'
        run: |
          echo 'One or more issuer sources failed. Last healthy portfolios were preserved.'
          exit 1
